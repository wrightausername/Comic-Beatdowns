name: Final Easy Mode formatter (one-time)

on:
  push:
    branches:
      - feature/guided-studio-ux
    paths:
      - .github/workflows/final-format-guided-studio.yml

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'wrightausername/Comic-Beatdowns'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix frontend ci --no-audit --no-fund
      - working-directory: frontend
        run: npx prettier --write src/App.tsx src/Editor.tsx src/GuidedWorkspace.tsx src/GuidedWorkspace.test.tsx src/VerdictAutopilot.tsx src/ProductionWorkflow.tsx src/dialogs.tsx src/styles.css e2e/studio.spec.ts
      - name: Commit formatted Easy Mode files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/App.tsx frontend/src/Editor.tsx frontend/src/GuidedWorkspace.tsx frontend/src/GuidedWorkspace.test.tsx frontend/src/VerdictAutopilot.tsx frontend/src/ProductionWorkflow.tsx frontend/src/dialogs.tsx frontend/src/styles.css frontend/e2e/studio.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m 'Format final Easy Mode improvements'
            git push origin HEAD:refs/heads/feature/guided-studio-ux
          fi
