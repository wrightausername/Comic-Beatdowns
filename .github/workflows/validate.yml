name: Validate studio

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install FFmpeg
        run: choco install ffmpeg --no-progress -y
      - name: Validate Windows launcher and application startup
        shell: cmd
        run: call "Start Studio.cmd" --check < nul
      - name: Validate real vertical rendering on Windows
        run: .venv/Scripts/python.exe -m pytest backend/tests/test_render.py -q
  validate:
    runs-on: ubuntu-24.04
    env:
      PIP_CACHE_DIR: ${{ runner.temp }}/comic-beatdowns-pip-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install and build
        run: make setup
      - name: Lint, backend integration tests, frontend tests, and production build
        run: make check
      - name: Install browser
        run: npm --prefix frontend exec -- playwright install --with-deps chromium
      - name: Browser production workflow
        run: make e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: frontend/test-results
          retention-days: 7
