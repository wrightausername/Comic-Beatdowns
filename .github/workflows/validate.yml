name: Validate studio

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install FFmpeg
        run: choco install ffmpeg --no-progress -y
      - name: Validate Windows launcher and application startup
        shell: cmd
        run: |
          call "Start Studio.cmd" --check < nul > windows-startup.log 2>&1
          set "CB_LAUNCH_EXIT=%errorlevel%"
          type windows-startup.log
          exit /b %CB_LAUNCH_EXIT%
      - name: Validate real vertical rendering on Windows
        run: .venv/Scripts/python.exe -m pytest backend/tests/test_render.py backend/tests/test_effects.py -q --tb=short --junitxml=windows-media-tests.xml
      - name: Report Windows validation failures
        if: failure()
        shell: python
        run: |
          from pathlib import Path
          import xml.etree.ElementTree as ET
          def annotate(title, message):
              message = message[-3800:].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title={title}::{message}")
          report = Path("windows-media-tests.xml")
          if report.exists():
              for case in ET.parse(report).iter("testcase"):
                  for failure in list(case.findall("failure")) + list(case.findall("error")):
                      annotate(case.get("name"), failure.text or failure.get("message", "Test failed"))
          elif Path("windows-startup.log").exists():
              annotate("Windows startup", Path("windows-startup.log").read_text(errors="replace"))
  validate:
    runs-on: ubuntu-24.04
    env:
      PIP_CACHE_DIR: /tmp/comic-beatdowns-pip-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install and build
        run: make setup
      - name: Lint, backend integration tests, frontend tests, and production build
        run: make check
      - name: Install browser
        run: npm --prefix frontend exec -- playwright install --with-deps chromium
      - name: Browser production workflow
        run: make e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: frontend/test-results
          retention-days: 7
