name: Format cleaned creator flow once

on:
  push:
    branches:
      - feature/whole-page-director-p0
    paths:
      - '.github/workflows/format-final-simple-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Format simplified shot editing and tests
        run: |
          npm --prefix frontend ci --no-audit --no-fund
          npx --prefix frontend prettier --write frontend/src/PageShotReview.tsx frontend/src/PageShotReview.test.tsx frontend/src/VerdictAutopilot.test.tsx frontend/src/styles.css
      - name: Commit formatted code
        run: |
          git config user.name 'Comic Beatdowns CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/PageShotReview.tsx frontend/src/PageShotReview.test.tsx frontend/src/VerdictAutopilot.test.tsx frontend/src/styles.css
          if ! git diff --staged --quiet; then
            git commit -m 'Format creator-first shot editing UI after duplicate control cleanup'
            git push origin HEAD:feature/whole-page-director-p0
          fi
