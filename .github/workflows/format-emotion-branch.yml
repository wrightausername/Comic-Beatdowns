name: Format emotion feature branch
on:
  push:
    branches:
      - feature/verdict-emotion-timeline
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Format only new feature source
        working-directory: frontend
        run: npx prettier --write src/Editor.tsx src/emotion.ts src/emotion.test.ts src/EmotionTimeline.tsx src/styles.css
      - name: Commit formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/Editor.tsx frontend/src/emotion.ts frontend/src/emotion.test.ts frontend/src/EmotionTimeline.tsx frontend/src/styles.css
          if ! git diff --cached --quiet; then
            git commit -m "Format Emotion Timeline source"
            git push origin HEAD:feature/verdict-emotion-timeline
          fi
