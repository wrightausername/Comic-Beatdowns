name: Format creator shot editor once

on:
  push:
    branches:
      - feature/whole-page-director-p0
    paths:
      - '.github/workflows/format-shot-editor-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Format shot editor source and tests
        run: |
          npm --prefix frontend ci --no-audit --no-fund
          npx --prefix frontend prettier --write frontend/src/PageShotReview.tsx frontend/src/PageShotReview.test.tsx frontend/src/pageReviewGeometry.ts frontend/src/pageReviewGeometry.test.ts frontend/src/editing.ts frontend/src/editing.test.ts frontend/src/Editor.tsx frontend/src/VerdictAutopilot.tsx frontend/src/styles.css
      - name: Commit only formatting changes
        run: |
          git config user.name 'Comic Beatdowns CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src
          if ! git diff --staged --quiet; then
            git commit -m 'Prettier format creator shot editor'
            git push origin HEAD:feature/whole-page-director-p0
          fi
