name: Format Publishing feature
on:
  push:
    branches:
      - feature/crosspost-publishing
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install formatters
        run: |
          python -m pip install ruff==0.11.13
          npm ci --prefix frontend
      - name: Format changed source files
        run: |
          ruff format backend/app/publishing.py backend/tests/test_publishing.py
          cd frontend
          npx prettier --write src/App.tsx src/PublishingDesk.tsx src/styles.css
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/publishing.py backend/tests/test_publishing.py frontend/src/App.tsx frontend/src/PublishingDesk.tsx frontend/src/styles.css
          if ! git diff --cached --quiet; then
            git commit -m "Format publishing feature source"
            git push origin HEAD:feature/crosspost-publishing
          fi
