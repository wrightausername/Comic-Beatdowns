name: Share verified Windows owner preview

on:
  workflow_dispatch:
  push:
    branches: [fix/quiet-desktop-guided-flow]
    paths: [.github/workflows/share-owner-preview.yml]

permissions:
  actions: read
  contents: write

concurrency:
  group: share-guided-fix-preview-2026-11-27
  cancel-in-progress: false

jobs:
  share:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download the already tested Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: Comic-Beatdowns-Studio-Windows
          run-id: 45989014931
          github-token: ${{ github.token }}
          path: verified
      - name: Verify the exact tested executable and prepare direct download
        shell: python
        run: |
          import hashlib
          from pathlib import Path
          import shutil
          root = Path('verified')
          original = root / 'Comic Beatdowns Studio.exe'
          expected = '21d03a7b5cc6c4a3658760ae11238723c2212decfa5f89885d1afc295c05f35d'
          actual = hashlib.sha256(original.read_bytes()).hexdigest()
          if actual != expected or (root / 'SHA256.txt').read_text(encoding='utf-8-sig').strip().lower() != expected:
              raise RuntimeError('The downloaded EXE does not match the tested owner build')
          shutil.copyfile(original, root / 'Comic-Beatdowns-Studio.exe')
          shutil.copyfile(original, root / 'Comic-Beatdowns-Studio-2026-11-27-Guided-Fix.exe')
          (root / 'SHA256.txt').write_text(actual + '  Comic-Beatdowns-Studio.exe\n' + actual + '  Comic-Beatdowns-Studio-2026-11-27-Guided-Fix.exe\n')
          print('Verified original executable:', actual)
      - name: Share the standalone EXE as an owner test preview
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag=studio-guided-fix-preview-2026-11-27
          source=d1e3d613c2061e2bf8480d733d86f37bf9037afa
          cat > preview-notes.md <<'NOTES'
          Owner test preview from draft PR #20, stacked on #19. Background media tools run without Windows console windows. Guided editing shows one work area at a time; Edit this draft and Preview my changes revise saved shots without rerunning automatic editing. Page order is preserved by default, with improved panel crop handling and explicit page re-detection.

          Download **Comic-Beatdowns-Studio-2026-11-27-Guided-Fix.exe** below. Close every older Studio window, then open that dated file directly from Downloads. In a project, this build shows four steps: Add files, Make a draft, Edit shots, Review & export. No ZIP extraction or installer is needed. WebView2 and a compatible .NET runtime remain prerequisites. Existing project data stays under `%LOCALAPPDATA%\ComicBeatdownsStudio`.

          Source: `d1e3d613c2061e2bf8480d733d86f37bf9037afa`. This is the unchanged EXE from package run 45989014931, artifact 15192402561, verified against its original SHA256 before upload. Separate Windows Server 2022/2025 runners passed downloaded-EXE startup and authenticated native-window checks. Actual owner Windows 10/11 acceptance remains open.

          Validation run 45989014858 passed 201 backend tests (one Windows-only check skipped on Linux), 70 frontend tests, 16 browser workflows and 121 Windows media/reference tests.

          This is an unsigned owner trial, not a production release or a merge of the draft PRs. Issue #14's irregular-page automation gate remains open. Reference styles reproduce supported editable effects, not arbitrary third-party plugins. Optional vision interpretation was tested with mocked providers, not a live model. Installer and code-signing work remain excluded from this trial.
          NOTES
          if gh release view "$tag" --repo "$OWNER_REPO" >/dev/null 2>&1; then
            target=$(gh api "repos/$OWNER_REPO/git/ref/tags/$tag" --jq .object.sha)
            test "$target" = "$source"
            gh release upload "$tag" verified/Comic-Beatdowns-Studio-2026-11-27-Guided-Fix.exe verified/SHA256.txt --repo "$OWNER_REPO" --clobber
            gh release edit "$tag" --repo "$OWNER_REPO" --draft=false --prerelease --notes-file preview-notes.md
          else
            gh release create "$tag" verified/Comic-Beatdowns-Studio.exe verified/Comic-Beatdowns-Studio-2026-11-27-Guided-Fix.exe verified/SHA256.txt --repo "$OWNER_REPO" --target "$source" --prerelease --title 'Comic Beatdowns Studio — quiet desktop and guided editing preview, November 27' --notes-file preview-notes.md
          fi
