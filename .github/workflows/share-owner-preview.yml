name: Share verified Windows owner preview

on:
  workflow_dispatch:
  push:
    branches: [feature/autonomous-editing-workflow]
    paths: [.github/workflows/share-owner-preview.yml]

permissions:
  actions: read
  contents: write

concurrency:
  group: share-autonomy-preview-2026-11-27
  cancel-in-progress: false

jobs:
  share:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download the already tested Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: Comic-Beatdowns-Studio-Windows
          run-id: 46067314435
          github-token: ${{ github.token }}
          path: verified
      - name: Verify the exact tested executable and prepare direct download
        shell: python
        run: |
          import hashlib
          from pathlib import Path
          import shutil
          root = Path('verified')
          original = root / 'Comic Beatdowns Studio.exe'
          expected = 'a9367748feac13c3d335cbcdbff71d789dd04155afd4304bd89e3bbd6d634298'
          actual = hashlib.sha256(original.read_bytes()).hexdigest()
          if actual != expected or (root / 'SHA256.txt').read_text(encoding='utf-8-sig').strip().lower() != expected:
              raise RuntimeError('The downloaded EXE does not match the tested owner build')
          shutil.copyfile(original, root / 'Comic-Beatdowns-Studio.exe')
          shutil.copyfile(original, root / 'Comic-Beatdowns-Studio-2026-11-27-Autonomy-Preview.exe')
          (root / 'SHA256.txt').write_text(actual + '  Comic-Beatdowns-Studio.exe\n' + actual + '  Comic-Beatdowns-Studio-2026-11-27-Autonomy-Preview.exe\n')
          print('Verified original executable:', actual)
      - name: Share the standalone EXE as an owner test preview
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag=studio-autonomy-preview-2026-11-27
          source=e05aa1da014ede6863556590afb5f5c93d57177d
          cat > preview-notes.md <<'NOTES'
          Owner test preview from draft PR #21, stacked on #20. Adds story/timing reports, region-linked narration planning, contextual sound choices, bounded technical render inspection/repair, reversible sequence requests, prepared alternatives and cached background previews. It keeps the existing four-step workspace, timeline, Undo and private local profile.

          Download **Comic-Beatdowns-Studio-2026-11-27-Autonomy-Preview.exe** below. Close every older Studio window, then open that dated file directly from Downloads. No ZIP extraction or installer is needed. If ChatGPT shows a blank download tab, paste the GitHub EXE link into Edge or Chrome opened from Windows, then check Downloads with Ctrl+J. Existing projects stay under `%LOCALAPPDATA%\ComicBeatdownsStudio`.

          Find Story & timing plan under Make a draft, and sequence requests/Compare another approach in AI editing assistant. Automatically preview my saved edits is a visible option in Autopilot-enabled projects. Every proposed edit stays previewable and reversible; final export choices and publishing remain separate.

          Source: `e05aa1da014ede6863556590afb5f5c93d57177d`. This is the unchanged EXE from package run 46067314435, artifact 15231406731. Original SHA256: `a9367748feac13c3d335cbcdbff71d789dd04155afd4304bd89e3bbd6d634298`. Separate Windows Server 2022/2025 runners passed downloaded-EXE startup and authenticated native-window checks. The actual downloaded bundle was inspected for the new UI and backend planning, sequence, cache and quiet-process modules.

          Validation run 46067314452 covers 216 backend tests (one Windows-only check skipped on Linux), 70 frontend tests, 17 browser workflows and 136 Windows media tests. Original synthetic fixtures and mocked providers verify mechanisms; real-material creative acceptance and actual owner Windows 10/11 trials remain open.

          Local mode leaves unknown story facts empty. Imported SRT timing is phrase-level; word anchors require observed speech evidence. Local opening/middle/ending sequence scopes use timeline thirds. Repair is bounded to two technical attempts and does not remove intentional silence or dark artwork. The cache reuses video segments; audio, captions and branding are remixed. Unfinished paid provider calls are not silently replayed.

          This is an unsigned owner preview, not a production release or merge of draft PRs. Issue #14's irregular-page/story-aware camera gate remains open. WebView2 and a compatible .NET runtime remain prerequisites. Installer work is excluded; nothing is automatically published.
          NOTES
          if gh release view "$tag" --repo "$OWNER_REPO" >/dev/null 2>&1; then
            target=$(gh api "repos/$OWNER_REPO/git/ref/tags/$tag" --jq .object.sha)
            test "$target" = "$source"
            gh release upload "$tag" verified/Comic-Beatdowns-Studio-2026-11-27-Autonomy-Preview.exe verified/SHA256.txt --repo "$OWNER_REPO" --clobber
            gh release edit "$tag" --repo "$OWNER_REPO" --draft=false --prerelease --notes-file preview-notes.md
          else
            gh release create "$tag" verified/Comic-Beatdowns-Studio.exe verified/Comic-Beatdowns-Studio-2026-11-27-Autonomy-Preview.exe verified/SHA256.txt --repo "$OWNER_REPO" --target "$source" --prerelease --title 'Comic Beatdowns Studio — autonomous editing preview, November 27' --notes-file preview-notes.md
          fi
