name: Share verified Windows owner preview

on:
  workflow_dispatch:
  push:
    branches: [feature/production-trash]
    paths: [.github/workflows/share-owner-preview.yml]

permissions:
  actions: read
  contents: write

concurrency:
  group: share-draft-fix-preview-2026-11-27
  cancel-in-progress: false

jobs:
  share:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download the already tested Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: Comic-Beatdowns-Studio-Windows
          run-id: 46087066098
          github-token: ${{ github.token }}
          path: verified
      - name: Verify the exact tested executable and prepare the dated download
        shell: python
        run: |
          import hashlib
          from pathlib import Path
          import shutil
          root = Path('verified')
          original = root / 'Comic Beatdowns Studio.exe'
          expected = 'd2a5ae52dd60f08ccb7c25757a11b6c7c04bb61b9f50ed7df4417a8278ce8624'
          actual = hashlib.sha256(original.read_bytes()).hexdigest()
          if actual != expected or (root / 'SHA256.txt').read_text(encoding='utf-8-sig').strip().lower() != expected:
              raise RuntimeError('The downloaded EXE does not match the tested owner build')
          name = 'Comic-Beatdowns-Studio-2026-11-27-Draft-Fix.exe'
          shutil.copyfile(original, root / name)
          (root / 'SHA256.txt').write_text(actual + '  ' + name + '\n')
          print('Verified original executable:', actual)
      - name: Share the standalone EXE as an owner test preview
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag=studio-draft-fix-preview-2026-11-27
          source=db47965b3e0b870f99ea1a1f11a6ededa5f58552
          cat > preview-notes.md <<'NOTES'
          Owner test preview from draft PR #23, stacked on #22. Fixes Make a draft rejecting server-owned narration-approval metadata after import. Draft validation now names the field and constraint beside the draft button; retry keeps uploaded pages/audio. The imported-media regression reaches a real preview. Adds a visible Delete production action to every production card and the open workspace, a confirmation, and visible Trash with Restore. This is reversible deletion: it keeps source files, narration, shots, history and exports on your computer. Active draft builds/renders must finish first. Trashed productions stop inbox scanning and disappear from the active desk and export lists; Restore brings them back.

          Download **Comic-Beatdowns-Studio-2026-11-27-Draft-Fix.exe**. Close older Studio windows and launch this dated file from Downloads. Existing productions remain in the same local profile. The prior named-panel organizer, automatic crop/order, timeline, style-reference, editing assistant, cached previews and quiet subprocess changes are included. No installer or ZIP extraction is needed for the executable.

          Source: `db47965b3e0b870f99ea1a1f11a6ededa5f58552`. Original package run 46087066098, artifact 15239173815; 146601013 bytes. SHA256: `d2a5ae52dd60f08ccb7c25757a11b6c7c04bb61b9f50ed7df4417a8278ce8624`. Separate Windows Server 2022/2025 checks verify the actual downloaded executable's startup and authenticated native window. Local checks cover 233 backend cases (one Windows-only skip), 77 frontend tests and 20 browser workflows; Windows media validation includes the lifecycle integration cases. Public transfers with Windows PowerShell 5.1 and checksum verification run after sharing, and must pass before delivery.

          A successful GitHub transfer does not repair ChatGPT's blank download page. The owner will also receive a download-only PowerShell command that bypasses that browser page, checks the exact SHA256 and saves the EXE to Downloads without launching it or changing execution policy.

          This unsigned owner preview does not merge drafts or publish videos. Actual owner Windows 10/11 and real-comic/irregular-page creative acceptance remain open under Issue #14. WebView2 and a compatible .NET runtime remain prerequisites.
          NOTES
          if gh release view "$tag" --repo "$OWNER_REPO" >/dev/null 2>&1; then
            target=$(gh api "repos/$OWNER_REPO/git/ref/tags/$tag" --jq .object.sha)
            test "$target" = "$source"
            gh release upload "$tag" verified/Comic-Beatdowns-Studio-2026-11-27-Draft-Fix.exe verified/SHA256.txt --repo "$OWNER_REPO" --clobber
            gh release edit "$tag" --repo "$OWNER_REPO" --draft=false --prerelease --notes-file preview-notes.md
          else
            gh release create "$tag" verified/Comic-Beatdowns-Studio-2026-11-27-Draft-Fix.exe verified/SHA256.txt --repo "$OWNER_REPO" --target "$source" --prerelease --title 'Comic Beatdowns Studio — first draft fix and production Trash, November 27' --notes-file preview-notes.md
          fi

  verify-public-download:
    needs: share
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download the new public release through Windows PowerShell 5.1
        shell: powershell
        run: |
          $studioUrl = 'https://github.com/wrightausername/Comic-Beatdowns/releases/download/studio-draft-fix-preview-2026-11-27/Comic-Beatdowns-Studio-2026-11-27-Draft-Fix.exe'
          $studioSha = 'd2a5ae52dd60f08ccb7c25757a11b6c7c04bb61b9f50ed7df4417a8278ce8624'
          $studioDestination = Join-Path $env:RUNNER_TEMP 'Verified/Comic-Beatdowns-Studio.exe'
          & ./scripts/download-owner-preview.ps1 -Url $studioUrl -Sha256 $studioSha -Destination $studioDestination
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw 'This must exercise Windows PowerShell 5.1.' }
      - name: Test the exact copy-and-paste owner command in Windows Downloads
        shell: powershell
        run: |
          # The following block is the exact download-only command supplied to the owner.
          & {
            $ErrorActionPreference='Stop'; $ProgressPreference='SilentlyContinue'
            [Net.ServicePointManager]::SecurityProtocol=[Net.SecurityProtocolType]::Tls12
            $studioFile="$env:USERPROFILE\Downloads\Comic-Beatdowns-Studio-2026-11-27-Draft-Fix.exe"
            New-Item -ItemType Directory -Force (Split-Path $studioFile) | Out-Null
            Invoke-WebRequest -UseBasicParsing 'https://github.com/wrightausername/Comic-Beatdowns/releases/download/studio-draft-fix-preview-2026-11-27/Comic-Beatdowns-Studio-2026-11-27-Draft-Fix.exe' -OutFile "$studioFile.partial"
            if ((Get-FileHash "$studioFile.partial" -Algorithm SHA256).Hash -ne 'd2a5ae52dd60f08ccb7c25757a11b6c7c04bb61b9f50ed7df4417a8278ce8624') { throw 'Download verification failed' }
            Move-Item "$studioFile.partial" $studioFile -Force
          }
          # Do not execute the owner's EXE from this download-only command.
          if ((Get-Item "$env:USERPROFILE\Downloads\Comic-Beatdowns-Studio-2026-11-27-Draft-Fix.exe").Length -ne 146601013) { throw 'Incorrect download length' }
