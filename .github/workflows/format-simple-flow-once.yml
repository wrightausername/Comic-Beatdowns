name: Format simple production flow once

on:
  push:
    branches:
      - feature/whole-page-director-p0
    paths:
      - '.github/workflows/format-simple-flow-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Format one-click production UI
        run: |
          npm --prefix frontend ci --no-audit --no-fund
          npx --prefix frontend prettier --write frontend/src/PageShotReview.tsx frontend/src/PageShotReview.test.tsx frontend/src/VerdictAutopilot.tsx frontend/src/VerdictAutopilot.test.tsx frontend/src/Editor.tsx frontend/src/styles.css frontend/e2e/studio.spec.ts
      - name: Commit only formatted changes
        run: |
          git config user.name 'Comic Beatdowns CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/PageShotReview.tsx frontend/src/PageShotReview.test.tsx frontend/src/VerdictAutopilot.tsx frontend/src/VerdictAutopilot.test.tsx frontend/src/Editor.tsx frontend/src/styles.css frontend/e2e/studio.spec.ts
          if ! git diff --staged --quiet; then
            git commit -m 'Format one-click creator shot review UX'
            git push origin HEAD:feature/whole-page-director-p0
          fi
